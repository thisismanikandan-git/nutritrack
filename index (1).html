<title>NutriTrack - South Indian Calorie Tracker</title>
<style>

.search{width:100%;padding:11px 14px;border-radius:13px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.65);outline:none;font-size:14px;margin-bottom:10px}

ul.ing{margin:6px 0 4px 18px;font-size:13px;line-height:1.7}

@media(max-width:380px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.tab .ic{font-size:19px}}

function hero(){const T=calc(S.prof),t=tot(),pct=Math.min(1,t.cal/T.cal),over=t.cal>T.cal,h=new Date().getHours(),C=2*Math.PI*44;
const bar=(l,v,m,c)=>`<div class="mac"><div><span>${l}</span><span style="color:${v>m?"#dc2626":c}">${r(v)} / ${m}g</span></div><div class="bar"><i style="width:${Math.min(100,v/m*100)}%;background:${v>m?"#dc2626":c}"></i></div></div>`;
$("#hero").innerHTML=`<div class="ring"><svg width="104" height="104"><circle cx="52" cy="52" r="44" fill="none" stroke="rgba(150,100,40,.18)" stroke-width="9"/><circle cx="52" cy="52" r="44" fill="none" stroke="${over?"#ef4444":"#f97316"}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" style="transition:stroke-dashoffset .7s"/></svg><div><b style="color:${over?"#dc2626":"inherit"}">${r(t.cal)}</b><span>of ${T.cal} kcal</span></div></div>
<div><h2>${h<12?"Good morning":h<17?"Good afternoon":"Good evening"} 👋</h2><p>${new Date(S.date+"T00:00").toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short"})} · ${T.wl} kg/week pace</p>
<div class="${over?"bad":"ok"}">${over?"⚠ "+r(t.cal-T.cal)+" kcal over limit":"✓ "+r(T.cal-t.cal)+" kcal left"}</div>${bar("Protein",t.p,T.prot,"#3b82f6")}${bar("Carbs",t.c,T.carb,"#f59e0b")}${bar("Fat",t.f,T.fat,"#ef4444")}</div>`}
function tabs(){$("#tabs").innerHTML=TABS.map(t=>`<button class="tab ${S.tab===t.id?"on":""}" style="--c:${t.c}" data-a="tab" data-v="${t.id}"><em>${t.d.length}</em><span class="ic">${t.ic}</span>${t.l}</button>`).join("")}
const cur=()=>TABS.find(t=>t.id===S.tab);
function chips(){const t=cur(),cs=["All",...new Set(t.d.map(x=>x.cat))];$("#chips").style.setProperty("--c",t.c);$("#chips").innerHTML=cs.map(c=>`<button class="chip ${S.cat===c?"on":""}" data-a="cat" data-v="${c}">${c}</button>`).join("");$("#q").placeholder="Search "+t.l.toLowerCase()+"..."}
function list(){const t=cur(),q=S.q.toLowerCase(),L=t.d.filter(x=>(S.cat==="All"||x.cat===S.cat)&&(x.n||"").toLowerCase().includes(q)),el=$("#list");el.style.setProperty("--c",t.c);
el.innerHTML=L.length?L.map(x=>S.tab==="recipes"?`<button class="row" data-a="rec" data-v="${RECIPES.indexOf(x)}"><div class="n"><b>${x.n}</b><small>⏱ ${x.time} · ⚡ ${x.diff} · ${x.cat}</small></div><span class="plus" style="font-size:14px">📖</span></button>`:`<button class="row" data-a="add" data-v="${x.id}"><div class="n"><b>${x.n}</b><small><u>${x.cal} kcal</u> · P ${x.p}g · C ${x.c}g · F ${x.f}g</small></div><span class="plus">+</span></button>`).join(""):`<div class="empty">Nothing found</div>`}
function log(){const d=day();$("#undo").disabled=!S.hist.length;$("#log").innerHTML=d.length?MEALS.map((m,mi)=>{const g=d.map((e,i)=>({e,i})).filter(x=>x.e.meal===m);if(!g.length)return"";return`<div class="glass grp"><h4><span style="color:inherit">${MI[mi]} ${m}</span><span>${r(g.reduce((s,x)=>s+x.e.cal*x.e.q,0))} kcal</span></h4>${g.map(x=>`<div class="ent"><b>${x.e.n}</b><i>${r(x.e.cal*x.e.q)} kcal</i><small>×${x.e.q}</small><button class="x" data-a="del" data-v="${x.i}" aria-label="Remove">×</button></div>`).join("")}</div>`}).join(""):`<div class="empty">Nothing logged yet — tap a food above 🍽️</div>`}
const all=()=>{hero();tabs();chips();list();log();sv()};
function sheet(h){$("#modal").innerHTML=h?`<div class="ov" data-a="close"><div class="sh" onclick="event.stopPropagation()">${h}</div></div>`:""}
function addSheet(){const x=M.x,q=M.q;sheet(`<h2>${x.n}</h2><small style="color:var(--mut)">${x.cat}</small><div class="nut">${[["kcal",x.cal],["Protein",x.p],["Carbs",x.c],["Fat",x.f]].map(a=>`<div><b>${r(a[1]*q*10)/10}</b><small>${a[0]}</small></div>`).join("")}</div>
<div class="stp"><button data-a="qty" data-v="-.5">−</button><span>${q}</span><button data-a="qty" data-v=".5">+</button></div>
<div class="meals">${MEALS.map((m,i)=>`<button class="chip ${M.meal===m?"on":""}" style="--c:#c2410c" data-a="meal" data-v="${m}">${MI[i]} ${m}</button>`).join("")}</div>
<button class="cta" data-a="confirm">Add ${q} serving${q!==1?"s":""} · ${r(x.cal*q)} kcal</button>`)}
function recSheet(rc){const f=FOODS.find(x=>x.n===rc.food);sheet(`<h2>📖 ${rc.n}</h2><small style="color:var(--mut)">⏱ ${rc.time} · ⚡ ${rc.diff}${f?" · 🔥 "+f.cal+" kcal/serving":""}</small><h3 style="margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:1px">Ingredients</h3><ul class="ing">${rc.ing.map(i=>`<li>${i}</li>`).join("")}</ul><h3 style="margin:14px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:1px">Method</h3>${rc.steps.map((s,i)=>`<div class="step"><b>${i+1}</b><span>${s}</span></div>`).join("")}${f?`<button class="cta" style="margin-top:8px" data-a="logrec" data-v="${f.id}">+ Log this dish</button>`:""}`)}
function profSheet(){const p=S.prof,T=calc(p);sheet(`<h2>Your profile</h2><div class="fld">${[["w","Weight (kg)"],["gw","Goal (kg)"],["h","Height (cm)"],["age","Age"]].map(a=>`<div><label>${a[1]}</label><input type="number" id="p_${a[0]}" value="${p[a[0]]}" step="0.5"></div>`).join("")}
<div><label>Gender</label><select id="p_g"><option value="m" ${p.g==="m"?"selected":""}>Male</option><option value="f" ${p.g==="f"?"selected":""}>Female</option></select></div>
<div><label>Activity</label><select id="p_act">${[["Sedentary",1.2],["Light",1.375],["Moderate",1.55],["Very active",1.725]].map(a=>`<option value="${a[1]}" ${p.act===a[1]?"selected":""}>${a[0]}</option>`).join("")}</select></div></div>
<label style="font-size:10px;font-weight:800;text-transform:uppercase;color:var(--mut)">Goal duration: <span id="wkv">${p.wk}</span> weeks</label><input type="range" id="p_wk" min="4" max="104" value="${p.wk}" style="width:100%;margin:6px 0 12px;accent-color:#c2410c" oninput="document.getElementById('wkv').textContent=this.value">
<div class="nut"><div><b>${T.cal}</b><small>kcal/day</small></div><div><b>${T.prot}g</b><small>Protein</small></div><div><b>${T.carb}g</b><small>Carbs</small></div><div><b>${T.fat}g</b><small>Fat</small></div></div><button class="cta" data-a="save">Save profile</button>`)}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1600)}
function push(x,q,meal){snap();day().push({n:x.n,cal:x.cal,p:x.p,c:x.c,f:x.f,q,meal});}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,v=t.dataset.v;
if(a==="tab"){S.tab=v;S.cat="All";S.q="";$("#q").value="";tabs();chips();list()}
else if(a==="cat"){S.cat=v;chips();list()}
else if(a==="add"){const x=[...FOODS,...INGS,...MEATS].find(i=>i.id===v);M={x,q:1,meal:S.meal};addSheet()}
else if(a==="qty"){M.q=Math.max(.5,+(M.q+ +v).toFixed(1));addSheet()}
else if(a==="meal"){M.meal=v;S.meal=v;addSheet()}
else if(a==="confirm"){push(M.x,M.q,M.meal);sheet("");all();toast("Added to "+M.meal)}
else if(a==="rec"){recSheet(RECIPES[+v])}
else if(a==="logrec"){const x=FOODS.find(i=>i.id===v);M={x,q:1,meal:S.meal};addSheet()}
else if(a==="del"){snap();day().splice(+v,1);all()}
else if(a==="clear"){if(day().length){snap();S.log[S.date]=[];all()}}
else if(a==="undo"){const h=S.hist.shift();if(h){S.log[h.d]=h.e;all()}}
else if(a==="prof"){profSheet()}
else if(a==="save"){const g=id=>$("#p_"+id).value;S.prof={w:+g("w")||82,gw:+g("gw")||65,h:+g("h")||170,age:+g("age")||30,g:g("g"),act:+g("act"),wk:+g("wk")};sheet("");all();toast("Profile saved")}
else if(a==="close"){sheet("")}});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="z"&&!e.shiftKey&&!/INPUT|SELECT/.test(e.target.tagName)){e.preventDefault();const h=S.hist.shift();if(h){S.log[h.d]=h.e;all()}}});
$("#q").addEventListener("input",e=>{S.q=e.target.value;list()});
$("#date").value=S.date;$("#date").addEventListener("change",e=>{S.date=e.target.value||today();all()});
all();
</script>
</body>
</html>
